# ================================================================
#  SOPE BACKEND – cấu hình không chứa secret.
#  Khai báo credential bằng environment hoặc script local bị Git bỏ qua.
# ================================================================

# ── Server ──────────────────────────────────────────────────────
server.port=${PORT:8080}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
spring.config.import=optional:file:./application-secrets.properties
# ── Database ────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── JWT ─────────────────────────────────────────────────────────
# Secret phải là chuỗi Base64, tối thiểu 256-bit (32 ký tự sau decode)
# Ví dụ tạo: echo -n "sope-secret-key-change-me-in-production-2025!" | base64
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# ── Google OAuth (đăng nhập bằng Google) ────────────────────────
# Lấy từ: https://console.cloud.google.com/apis/credentials
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ── VNPAY Sandbox ───────────────────────────────────────────────
# Lấy từ: https://sandbox.vnpayment.vn/merchantv2/
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/callback}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/payment/vnpay/ipn}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
# ── MoMo Sandbox ────────────────────────────────────────────────
# Lấy từ: https://developers.momo.vn/
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/api/payment/momo/callback}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payment/momo/ipn}
momo.request-type=${MOMO_REQUEST_TYPE:captureWallet}
momo.query-endpoint=${MOMO_QUERY_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/query}
momo.refund-endpoint=${MOMO_REFUND_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/refund}

# ── Shipping / Delivery ─────────────────────────────────────────
app.shipping.cutoff-hour=18
app.shipping.restock-delay-days=3

# ── Mail (SMTP Gmail) ────────────────────────────────────────────
# App Password 16 ký tự, tạo tại: Google Account > Bảo mật > Xác minh 2 bước > Mật khẩu ứng dụng
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.email-verification.expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:1440}

# ── Frontend / Chatbot integration ──────────────────────────────
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.frontend.origins=${APP_FRONTEND_ORIGINS:https://sope-frontend-self.vercel.app,http://localhost:3000,http://127.0.0.1:3000}
app.chatbot.url=${CHATBOT_URL:http://localhost:8000}
app.chatbot.secret=${CHATBOT_SECRET:}
app.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:3s}
app.http.read-timeout=${HTTP_READ_TIMEOUT:30s}

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.ecommerce=INFO
logging.level.org.springframework.security=WARN

# ── Default Admin ───────────────────────────────────────────────
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.email=${APP_ADMIN_EMAIL:admin@sope.local}
