# ── Shipping / Delivery ─────────────────────────────────────────
app.shipping.cutoff-hour=18
app.shipping.restock-delay-days=3

# ── Frontend / Chatbot integration ──────────────────────────────
app.frontend.origins=${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
app.chatbot.url=${CHATBOT_URL:http://localhost:8000}
app.chatbot.secret=${CHATBOT_SECRET:}
app.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:3s}
app.http.read-timeout=${HTTP_READ_TIMEOUT:30s}

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.ecommerce=INFO
logging.level.org.springframework.security=WARN

# ── Default Admin ───────────────────────────────────────────────
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123456}