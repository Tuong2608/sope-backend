# ================================================================
#  SOPE BACKEND – application.properties (MẪU)
#  Sao chép file này vào: src/main/resources/application.properties
#  Điền đúng giá trị rồi chạy: ./mvnw spring-boot:run
#  ⚠️ KHÔNG commit file này lên Git (đã có trong .gitignore)
# ================================================================

# ── Server ──────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database (chạy local – không dùng Docker) ───────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=24032005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

