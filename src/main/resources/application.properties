# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=ecommerce-backend

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
# Secret: Base64-encoded, minimum 256 bits (32 bytes) required for HS256
# IMPORTANT: Replace this with a securely generated secret in production!
# Generate with: openssl rand -base64 32
app.jwt.secret=dGhpcy1pcy1hLXNlY3VyZS1rZXktZm9yLWVjb21tZXJjZS1qd3QtdG9rZW4=
app.jwt.expiration-ms=86400000
