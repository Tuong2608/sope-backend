# A09 – Test database configuration (H2 in-memory)
# File này chỉ active khi chạy test (@ActiveProfiles("test"))
# KHÔNG ảnh hưởng database dev/prod (MySQL)

# ── H2 in-memory database ────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── H2 Console (xem DB trong test nếu cần debug) ────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Tắt seeder khi test (profile "test" được exclude trong seeder) ──────
# LaptopDataSeeder dùng @Profile("!test") nên không chạy

# ── JWT (dùng secret dummy cho test) ────────────────────────────────────
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0aW5nLW9ubHktbm90LXVzZWQtaW4tcHJvZHVjdGlvbg==
app.jwt.expiration-ms=3600000

# ── Tắt các feature không cần thiết khi test ────────────────────────────
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
